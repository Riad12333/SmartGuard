# Mosquitto MQTT Broker — SmartGuard
# Phase 0: open broker for local development.
# Phase 1+: enable authentication (password_file / acl).

listener 1883
protocol mqtt

allow_anonymous true

# Persistence
persistence true
persistence_location /mosquitto/data/

# Logging
log_dest file /mosquitto/log/mosquitto.log
log_dest stdout
log_type error
log_type warning
log_type notice
log_type information

# Connection limits
max_connections -1

# Message size (telemetry payloads are small)
message_size_limit 65536

# Keep alive
max_keepalive 65535
